name: PerfectBoyfriend
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Staging: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_ASSET_PATHS: ""

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm
    from: "26.0.0"

targets:
  PerfectBoyfriend:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PerfectBoyfriend
    info:
      path: PerfectBoyfriend/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        NSLocationWhenInUseUsageDescription: "Mite nutzt deinen Standort, um passende Vorschläge in deiner Nähe zu machen. Die Stadt ist jederzeit editierbar."
        NSCameraUsageDescription: "Mite nutzt die Kamera nur, wenn du freiwillig ein Foto aufnimmst oder deine Identität verifizierst."
        NSCalendarsFullAccessUsageDescription: "Mite prüft ausgewählte Zeitfenster lokal gegen deinen Kalender, um freie Termine für eure Gruppe zu finden. Kalenderinhalte werden nicht hochgeladen."
        NSLocalNetworkUsageDescription: "Mite verbindet sich im Entwicklungsmodus mit dem lokalen Testserver auf deinem Mac."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        PBLocalEmulatorHost: "$(PB_LOCAL_EMULATOR_HOST)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.perfectboyfriend
        PRODUCT_NAME: PerfectBoyfriend
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        APP_DISPLAY_NAME: Mite
      configs:
        Debug:
          # A free Personal Team may sign a device build, but cannot provision Sign in with
          # Apple. Keep that capability in the production entitlement; the local debug variant
          # still preserves Keychain access for Firebase Auth.
          CODE_SIGN_ENTITLEMENTS: PerfectBoyfriend.Debug.entitlements
          # The physical debug device uses this Mac's current Wi-Fi address. The Simulator
          # deliberately overrides it with 127.0.0.1 at runtime.
          PB_LOCAL_EMULATOR_HOST: "127.0.0.1"
        Staging:
          # A separate bundle allows Mite Staging and the production app to coexist. Until a
          # paid Apple Developer membership is available, use the capability-light entitlement
          # so email/password and all cloud-backed product flows remain device-testable.
          PRODUCT_BUNDLE_IDENTIFIER: com.example.perfectboyfriend.staging
          APP_DISPLAY_NAME: "Mite Staging"
          CODE_SIGN_ENTITLEMENTS: PerfectBoyfriend.Debug.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) STAGING"
          ENABLE_TESTABILITY: true
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        Release:
          # App Store provisioning retains Sign in with Apple in the production entitlement.
          CODE_SIGN_ENTITLEMENTS: PerfectBoyfriend.entitlements
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAppCheck
      - package: Stripe
        product: StripeIdentity
    postBuildScripts:
      - name: Upload Crashlytics Symbols
        basedOnDependencyAnalysis: true
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist"
          - "$(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)"
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}"
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist"
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}"
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}.debug.dylib"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/CrashlyticsSymbolsUploaded"
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          fi
          touch "$SCRIPT_OUTPUT_FILE_0"
  PerfectBoyfriendTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PerfectBoyfriendTests
    dependencies:
      - target: PerfectBoyfriend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.perfectboyfriend.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  PerfectBoyfriend:
    build:
      targets:
        PerfectBoyfriend: all
        PerfectBoyfriendTests: [test]
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    test:
      config: Debug
      targets:
        - PerfectBoyfriendTests
    archive:
      config: Release
  Mite Staging:
    build:
      targets:
        PerfectBoyfriend: all
        PerfectBoyfriendTests: [test]
    run:
      config: Staging
    profile:
      config: Staging
    analyze:
      config: Staging
    test:
      config: Staging
      targets:
        - PerfectBoyfriendTests
    archive:
      config: Staging
